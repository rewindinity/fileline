{{template "base.html" .}}

{{define "content"}}
<div>
    <!-- Feedback Alerts -->
    {{if .Error}}
    <div class="alert alert-error">
        <img src="/static/icons/bxs-error-circle.svg" alt="{{ T .Language "Error" }}" style="width: 20px; filter: brightness(0) saturate(100%) invert(35%) sepia(90%) saturate(3000%) hue-rotate(345deg) brightness(100%) contrast(100%);">
        {{ T .Language .Error }}
    </div>
    {{end}}

    <!-- Password Reset Form -->
    <form method="POST" action="/reset-password">
        <div class="form-group">
            <label for="username">{{ T .Language "Username" }}</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="recovery_code">{{ T .Language "Recovery Code" }}</label>
            <input type="text" id="recovery_code" name="recovery_code" placeholder="XXXX-XXXX-XXXX-XXXX" required autocomplete="off" style="font-family: monospace; letter-spacing: 0.05em;">
        </div>
        <div class="form-group">
            <label for="new_password">{{ T .Language "New Password" }}</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">{{ T .Language "Confirm New Password" }}</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ T .Language "Reset Password" }}</button>
    </form>

    <!-- Back to Login Navigation -->
    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
        <a href="/login" class="text-muted" style="font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.35rem; transition: color var(--transition);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            {{ T .Language "Back to Login" }}
        </a>
    </div>
</div>
{{end}}
