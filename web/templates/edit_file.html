{{template "base.html" .}} {{define "content"}}
<div class="container" style="max-width: 600px">
  <h1>Edit File Details</h1>

  <form method="POST" action="/edit">
    <input type="hidden" name="id" value="{{.File.ID}}" />

    <div class="form-group">
      <label>Original Name (Read-only)</label>
      <input type="text" value="{{.File.OriginalName}}" readonly style="background: #222; color: #888" />
    </div>

    <div class="form-group">
      <label for="custom_name">Custom Name</label>
      <input type="text" id="custom_name" name="custom_name" value="{{.File.CustomName}}" />
    </div>

    <div class="form-group">
      <label for="url_path">URL Path</label>
      <input type="text" id="url_path" name="url_path" value="{{.File.URLPath}}" />
    </div>

    <div class="form-group" style="display: flex; align-items: center">
      <input type="checkbox" id="is_private" name="is_private" {{if .File.IsPrivate}}checked{{end}} style="width: auto; margin-right: 10px" />
      <label for="is_private" style="margin-bottom: 0">Private File (requires login)</label>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem">
      <a href="/" style="padding: 0.75rem; background: #333; color: #fff; text-decoration: none; border-radius: 4px; text-align: center; flex: 1">Cancel</a>
      <button type="submit" style="margin-top: 0; flex: 1">Save Changes</button>
    </div>
  </form>
</div>
{{end}}
