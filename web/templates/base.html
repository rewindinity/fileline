<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - FileLine</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {{block "head" .}}{{end}}
</head>
<body>
    {{if .Username}}
    <header class="top-navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <img src="/static/logo.svg" alt="FileLine Logo">
                <span>FileLine</span>
            </a>
            <button class="mobile-nav-toggle" id="mobileNavBtn">
                <img src="/static/icons/bx-list-ul.svg" alt="Menu" style="width: 24px; filter: brightness(0) invert(1);">
            </button>
            <nav class="nav-links" id="navLinks">
                <a href="/" class="nav-item {{if eq .Title "Dashboard"}}active{{end}}">
                    <img src="/static/icons/bxs-dashboard.svg" alt="Dashboard">
                    Dashboard
                </a>
                <a href="/files" class="nav-item {{if eq .Title "My Files"}}active{{end}}">
                    <img src="/static/icons/bxs-folder.svg" alt="Files">
                    My Files
                </a>
                <a href="/settings" class="nav-item {{if eq .Title "Settings"}}active{{end}}">
                    <img src="/static/icons/bxs-cog.svg" alt="Settings">
                    Settings
                </a>
                <a href="/logout" class="nav-item" style="color: var(--error);">
                    <img src="/static/icons/bx-log-out.svg" alt="Logout" style="filter: brightness(0) saturate(100%) invert(35%) sepia(90%) saturate(3000%) hue-rotate(345deg) brightness(100%) contrast(100%);">
                    Logout ({{.Username}})
                </a>
            </nav>
        </div>
    </header>
    
    <div class="app-layout">
        <main class="main-content">
            {{block "content" .}}{{end}}
        </main>
    </div>
    
    <script>
        document.getElementById('mobileNavBtn')?.addEventListener('click', function() {
            document.getElementById('navLinks').classList.toggle('show');
        });
    </script>
    {{else}}
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <img src="/static/logo.svg" alt="FileLine Logo" style="width: 48px; margin-bottom: 1rem;">
                <h1>FileLine</h1>
                <p class="text-muted">{{.Title}}</p>
            </div>
            {{block "content" .}}{{end}}
        </div>
    </div>
    {{end}}
</body>
</html>
