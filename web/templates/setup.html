{{template "base.html" .}} {{define "content"}}
<div>
  {{if .Error}}
  <div class="alert alert-error">
    <img
      src="/static/icons/bxs-error-circle.svg"
      alt="Error"
      style="width: 20px; filter: brightness(0) saturate(100%) invert(35%) sepia(90%) saturate(3000%) hue-rotate(345deg) brightness(100%) contrast(100%)"
    />
    {{.Error}}
  </div>
  {{end}}
  <form method="POST" action="/setup">
    {{if not .DBConfigured}}
    <div class="form-group">
      <label for="db_type">Database Type</label>
      <select id="db_type" name="db_type" onchange="toggleDBFields()">
        <option value="sqlite">SQLite</option>
        <option value="postgres">PostgreSQL</option>
      </select>
    </div>

    <div id="sqlite_fields">
      <div class="form-group">
        <label for="sqlite_url">SQLite File Path</label>
        <input type="text" id="sqlite_url" name="sqlite_url" value="data/database.sqlite" />
      </div>
    </div>

    <div id="postgres_fields" style="display: none">
      <div class="form-group">
        <label for="pg_host">Host</label>
        <input type="text" id="pg_host" name="pg_host" value="localhost" />
      </div>
      <div class="form-group">
        <label for="pg_port">Port</label>
        <input type="text" id="pg_port" name="pg_port" value="5432" />
      </div>
      <div class="form-group">
        <label for="pg_user">User</label>
        <input type="text" id="pg_user" name="pg_user" value="postgres" />
      </div>
      <div class="form-group">
        <label for="pg_password">Password</label>
        <input type="password" id="pg_password" name="pg_password" />
      </div>
      <div class="form-group">
        <label for="pg_db">Database Name</label>
        <input type="text" id="pg_db" name="pg_db" value="fileline" />
      </div>
    </div>
    {{else}}
    <p class="text-muted text-center" style="color: var(--success)">Database configured via environment variables.</p>
    {{end}}

    <hr style="border-color: var(--border-color); margin: 2rem 0" />

    <h2>Storage Configuration</h2>
    <div class="form-group">
      <label for="storage_type">Storage Type</label>
      <select id="storage_type" name="storage_type" onchange="toggleStorageFields()">
        <option value="local">Local Disk</option>
        <option value="s3">S3 / Object Storage</option>
      </select>
    </div>

    <div id="local_storage_fields">
      <div class="form-group">
        <label for="local_path">Uploads Path</label>
        <input type="text" id="local_path" name="local_path" value="./uploads" />
      </div>
    </div>

    <div id="s3_storage_fields" style="display: none">
      <div class="form-group">
        <label for="s3_endpoint">S3 Endpoint URL (e.g. s3.amazonaws.com)</label>
        <input type="text" id="s3_endpoint" name="s3_endpoint" />
      </div>
      <div class="form-group">
        <label for="s3_region">S3 Region (e.g. us-east-1)</label>
        <input type="text" id="s3_region" name="s3_region" />
      </div>
      <div class="form-group">
        <label for="s3_bucket">S3 Bucket Name</label>
        <input type="text" id="s3_bucket" name="s3_bucket" />
      </div>
      <div class="form-group">
        <label for="s3_access_key">Access Key</label>
        <input type="text" id="s3_access_key" name="s3_access_key" />
      </div>
      <div class="form-group">
        <label for="s3_secret_key">Secret Key</label>
        <input type="password" id="s3_secret_key" name="s3_secret_key" />
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="s3_use_ssl" name="s3_use_ssl" checked />
        <label for="s3_use_ssl">Use SSL</label>
      </div>
    </div>

    <hr style="border-color: var(--border-color); margin: 2rem 0" />

    <h2>Admin Account</h2>
    <div class="form-group">
      <label for="username">Admin Username</label>
      <input type="text" id="username" name="username" required />
    </div>
    <div class="form-group">
      <label for="password">Admin Password</label>
      <input type="password" id="password" name="password" required />
    </div>

    <button type="submit" class="btn btn-primary btn-block">Complete Setup</button>
  </form>
</div>

{{if not .DBConfigured}}
<script>
  function toggleDBFields() {
    const type = document.getElementById("db_type").value;
    if (type === "sqlite") {
      document.getElementById("sqlite_fields").style.display = "block";
      document.getElementById("postgres_fields").style.display = "none";
    } else {
      document.getElementById("sqlite_fields").style.display = "none";
      document.getElementById("postgres_fields").style.display = "block";
    }
  }
</script>
{{end}}
<script>
  function toggleStorageFields() {
    const type = document.getElementById("storage_type").value;
    if (type === "local") {
      document.getElementById("local_storage_fields").style.display = "block";
      document.getElementById("s3_storage_fields").style.display = "none";
    } else {
      document.getElementById("local_storage_fields").style.display = "none";
      document.getElementById("s3_storage_fields").style.display = "block";
    }
  }
</script>
{{end}}
